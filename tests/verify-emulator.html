<!doctype html>
<meta charset="utf-8">
<title>FM1 Betis emulator acceptance tests</title>
<pre id="results">Running...</pre>
<script type="module">
/* BETIS_MIDI */
const results = [];
function check(condition, message) {
  if (!condition) throw Error(message);
  results.push(message);
}
try {
  if (!globalThis.FM1BetisMidi) {
    const script = document.createElement('script');
    script.src = '../web/betis-midi.js';
    await new Promise((resolve, reject) => {
      script.onload = resolve; script.onerror = () => reject(Error('MIDI adapter unavailable'));
      document.head.append(script);
    });
  }
  const {adaptMidi, encodeMidi} = globalThis.FM1BetisMidi;
  const smf = body => new Uint8Array([77,84,104,100,0,0,0,6,0,0,0,1,1,224,
    77,84,114,107,0,0,(body.length >>> 8) & 255,body.length & 255,...body]).buffer;
  const melody = adaptMidi(smf([0,0x90,60,100,0x83,0x60,0x80,60,0,0,0xff,0x2f,0]));
  check(melody.duration === 500, 'MIDI PPQN and default tempo yield 500 ms quarter note');
  const tempoChange = adaptMidi(smf([0,0xff,0x51,3,0x0f,0x42,0x40,
    0,0x90,60,100,0x83,0x60,0x80,60,0,0,0xff,0x2f,0]));
  check(tempoChange.duration === 1000, 'MIDI explicit tempo map is preserved');
  const sustain = adaptMidi(smf([0,0xb0,64,127,0,0x90,60,100,0x81,0x70,0x80,60,0,
    0x81,0x70,0xb0,64,0,0,0xff,0x2f,0]));
  check(sustain.events.find(e => e.data[0] === 0x80).ms === 500, 'Sustain is rendered into note duration');
  const repeated = adaptMidi(smf([0,0x90,60,100,0,0x91,60,90,0x81,0x70,0x80,60,0,
    0x81,0x70,0x81,60,0,0,0xff,0x2f,0]));
  check(repeated.events.filter(e => e.data[0] === 0x80).length === 1 &&
    repeated.events.find(e => e.data[0] === 0x80).ms === 500,
    'Merged channels retain overlapping note ownership');
  const poly = [];
  for (let note = 60; note < 70; note++) poly.push(0,0x90,note,100);
  poly.push(0x83,0x60,0xff,0x2f,0);
  const limited = adaptMidi(smf(poly));
  let held = 0, maximum = 0;
  for (const e of limited.events) {
    if (e.data[0] === 0x90) held++;
    if (e.data[0] === 0x80) held--;
    maximum = Math.max(maximum, held);
  }
  check(maximum === 8 && held === 0 && limited.report.stolen === 2, 'Adaptation caps FM polyphony and releases stolen voices');
  const midiRoundtrip = adaptMidi(encodeMidi(tempoChange).buffer);
  check(midiRoundtrip.duration === tempoChange.duration, 'Adapted MIDI file round-trip retains timing');
  for (const malformed of [new Uint8Array(), new Uint8Array([77,84,104,100]), new Uint8Array(smf([0,0x90,255]))]) {
    let rejected = false;
    try { adaptMidi(malformed.buffer); } catch { rejected = true; }
    check(rejected, 'Malformed MIDI explicitly rejected');
  }
  const response = await fetch('../docs/simulator.wasm');
  check(response.ok, 'Wasm download succeeds');
  const {instance} = await WebAssembly.instantiate(await response.arrayBuffer(), {});
  const c = instance.exports;
  c._initialize();
  c.sim_boot(1);
  const state = () => new Uint8Array(c.memory.buffer, c.sim_state(), 225);
  const tap = key => { c.sim_control(0, key, 1); c.sim_control(0, key, 0); };
  const render = blocks => {
    let peak = 0, sum = 0;
    for (let b = 0; b < blocks; b++) {
      const samples = new Float32Array(c.memory.buffer, c.sim_render(), 256);
      for (const sample of samples) {
        if (!Number.isFinite(sample)) throw Error('Non-finite audio sample');
        peak = Math.max(peak, Math.abs(sample)); sum += sample * sample;
      }
    }
    return {peak, rms: Math.sqrt(sum / (blocks * 256))};
  };
  const midi = bytes => {
    new Uint8Array(c.memory.buffer, c.sim_file(), bytes.length).set(bytes);
    check(c.sim_midi(bytes.length) === 0, `MIDI accepted: ${bytes.join(',')}`);
  };
  check(state()[1] === 19, 'Boots into Betis dashboard');
  check((c.sim_arp(0) & 256) !== 0, 'Official arpeggiator enabled by default');
  check(state()[209 + 7] === 16, 'Crowd rhythm is a 16-step loop');
  check(c.sim_open(0) === 0, 'Original overview remains accessible');
  c.sim_control(0,8,1); c.sim_control(0,2,1); c.sim_release();
  check(state()[1] === 19, 'HOME+FX returns to dashboard');
  const cents = [0,-100,0,-100,0,0,-100,100,0,0,-100,0];
  for (let track = 0; track < 8; track++)
    for (let pitch = 0; pitch < 12; pitch++)
      check(c.betis_tuning_cents(track, pitch) === cents[pitch], `Tuning ${track}:${pitch}`);
  const pixels = new Uint16Array(c.memory.buffer, c.sim_pixels(), 57600);
  check(pixels.some(pixel => pixel === 0x07e0), '240x240 RGB565 Betis green is rendered');
  c.sim_control(2, 5, 127);
  check(state()[18] + state()[19] * 256 === 180, 'Dashboard BPM capped at 180');
  c.sim_control(2, 5, -127);
  check(state()[18] + state()[19] * 256 === 60, 'Dashboard BPM floored at 60');
  tap(3);
  check(c.betis_tuning_cents(0, 1) === 0, 'SCL disables quantization');
  tap(3);
  check(c.betis_tuning_cents(0, 1) === -100, 'SCL restores quantization');
  midi([0x90,60,100]); midi([0x90,64,100]);
  const arpeggioNotes = new Set();
  for (let block = 0; block < 900; block++) {
    c.sim_render();
    const note = c.sim_arp(0) & 255;
    if (note !== 255) arpeggioNotes.add(note);
  }
  check(arpeggioNotes.has(60) && arpeggioNotes.has(64), 'Official arpeggiator advances both held notes');
  midi([0x80,60,0]); midi([0x80,64,0]);
  render(128);
  check((c.sim_arp(0) & 255) === 255, 'Arpeggiator releases when all keys are lifted');
  tap(10);
  check((c.sim_arp(0) & 256) === 0, 'ARP toggles to live playing');
  midi([0x90,60,100]); midi([0x90,61,100]);
  const sounding = render(128);
  check(sounding.rms > 0.00001 && sounding.peak <= 1.00001, 'FM output is audible, finite, and bounded');
  midi([0x80,60,0]);
  check(render(256).rms > 0.00001, 'Adjacent quantized MIDI notes release independently');
  midi([0x80,61,0]);
  render(4000);
  check(render(256).rms < 0.0001, 'Released notes and effect tails decay to silence');
  check(c.sim_export() === 0, 'Project export succeeds with tuning');
  const saved = new Uint8Array(c.memory.buffer,c.sim_file(),4264).slice();
  tap(3);
  new Uint8Array(c.memory.buffer,c.sim_file(),4264).set(saved);
  check(c.sim_import(4264) === 0, 'Project import succeeds');
  check(c.betis_tuning_cents(0,1) === -100, 'Project round-trip preserves scale');
  c.sim_panic();
  tap(12);
  check(render(768).rms > 0.00001, 'PLAY produces synthesized crowd percussion');
  tap(12);
  c.sim_panic();
  const match = () => c.betis_match_state();
  const project = () => {
    check(c.sim_export() === 0, 'Project capture succeeds');
    return new Uint8Array(c.memory.buffer, c.sim_file(), 4264).slice();
  };
  const beforeGrada = project();
  const flashBeforeGrada = c.sim_flash_revision();
  tap(2);
  check((match() & 3) === 1, 'FX opens La Grada');
  c.sim_control(2, 2, 1);
  check(((match() >>> 6) & 3) === 1, 'K1 selects a crowd rhythm');
  const afterSelect = project();
  check(beforeGrada.every((byte, i) => byte === afterSelect[i]), 'Browsing rhythms does not overwrite the project');
  c.sim_control(2, 3, 127);
  c.sim_control(2, 4, 127);
  check(((match() >>> 8) & 127) === 99 && ((match() >>> 15) & 127) === 99, 'Both score counters cap at 99');
  c.sim_control(2, 3, -127);
  c.sim_control(2, 4, -127);
  check(((match() >>> 8) & 127) === 0 && ((match() >>> 15) & 127) === 0, 'Score corrections cannot go below zero');
  const rhythmProjects = [];
  for (let rhythm = 0; rhythm < 4; rhythm++) {
    c.sim_control(2, 2, rhythm - ((match() >>> 6) & 3));
    tap(6);
    rhythmProjects.push(project());
    check(state()[209 + 7] === 16, `Rhythm ${rhythm + 1} installs a 16-step loop`);
    tap(12);
    const sound = render(768);
    check(sound.rms > 0.00001 && sound.peak <= 1.00001, `Rhythm ${rhythm + 1} produces bounded percussion`);
    tap(12); c.sim_panic();
  }
  check(rhythmProjects.every((p, i) => rhythmProjects.every((q, j) =>
    i === j || p.some((byte, k) => byte !== q[k]))), 'All four original crowd patterns are distinct');
  tap(2);
  check((match() & 3) === 2, 'FX opens representative 2025/26 XI');
  const knobs = () => new TextDecoder().decode(new Uint8Array(c.memory.buffer, c.sim_knobs(), 128));
  c.sim_lcd_targets();
  check(knobs().includes('JUGADOR'), 'Browser exposes the player selector, not a stale studio knob');
  check(c.sim_lcd_mask() === 1, 'XI exposes only the player knob');
  const portraitHashes = new Set();
  for (let player = 0; player < 11; player++) {
    c.sim_control(2, 2, player - ((match() >>> 2) & 15));
    check(((match() >>> 2) & 15) === player, `2025/26 player ${player + 1} is reachable`);
    c.sim_lcd_targets();
    const portrait = new Uint16Array(c.memory.buffer, c.sim_pixels(), 57600);
    let hash = 2166136261;
    const colors = new Set();
    for (let y = 62; y < 142; y++)
      for (let x = 168; x < 232; x++) {
        hash = Math.imul(hash ^ portrait[y * 240 + x], 16777619);
        colors.add(portrait[y * 240 + x]);
      }
    check(colors.size >= 7, `Portrait ${player + 1} renders in color on the real TFT buffer`);
    portraitHashes.add(hash);
  }
  check(portraitHashes.size === 11, 'All eleven player portraits are distinct');
  c.sim_control(2, 2, 127);
  check(((match() >>> 2) & 15) === 10, 'Player selection caps at eleven');
  c.sim_control(2, 2, -127);
  check(((match() >>> 2) & 15) === 0, 'Player selection floors at one');
  tap(2);
  check((match() & 3) === 3, 'FX opens Betis history');
  check(c.sim_lcd_mask() === 0, 'History has no stale editable knobs');
  tap(2);
  check(c.betis_screen_view() === 4, 'FX opens hymn and learning screen');
  tap(2);
  check(c.betis_screen_view() === 0, 'FX returns to the musical studio');
  c.sim_control(0,8,1); c.sim_control(0,2,1); c.sim_release();
  check((match() & 3) === 0 && state()[1] === 19, 'HOME+FX always resets to the Betis studio');
  check(c.sim_flash_revision() === flashBeforeGrada, 'Betis interaction performs no persistent flash writes');
  const arpBeforeHymn = c.sim_arp(0);
  const tuningBeforeHymn = c.betis_tuning_cents(0, 1);
  check(c.betis_midi_prepare(1) === 0, 'Hymn playback preparation succeeds');
  check(c.betis_tuning_cents(0, 1) === 0 && !(c.sim_arp(0) & 256), 'Hymns use original pitches without arpeggiation');
  check(c.betis_midi_prepare(0) === 0 && c.betis_tuning_cents(0, 1) === tuningBeforeHymn &&
    c.sim_arp(0) === arpBeforeHymn, 'Hymn stop restores prior tuning and arp');
  tap(10);
  check((c.sim_arp(0) & 256) !== 0, 'Arp can be enabled before hymn playback');
  check(c.betis_midi_prepare(1) === 0 && !(c.sim_arp(0) & 256), 'Hymn temporarily disables an enabled arp');
  check(c.betis_midi_prepare(0) === 0 && (c.sim_arp(0) & 256) !== 0, 'Hymn stop re-enables the original arp state');
  for (let i = 0; i < 4; i++) tap(2);
  check(c.betis_screen_view() === 4, 'Integrated hymn page is reachable');
  const lessonCount = c.betis_song_count();
  if (lessonCount) {
    check(lessonCount === 201, 'Private centenary melody contains all 201 teaching steps');
    tap(6);
    check(c.betis_song_mode() === 2 && c.betis_song_position() === 0, 'EDIT starts Aprender at step zero');
    check(c.betis_tuning_cents(0, 1) === 0 && !(c.sim_arp(0) & 256), 'Lesson uses original pitch classes without arp');
    render(256);
    check(c.betis_song_position() === 0, 'Lesson waits indefinitely rather than auto-advancing');
    const firstNote = c.betis_song_note(), wrongKey = (firstNote - 53 + 1) % 27;
    c.sim_control(1, wrongKey, 1); c.sim_control(1, wrongKey, 0); render(8);
    check(c.betis_song_position() === 0 && c.betis_song_errors() === 1, 'Wrong note reports an error without advancing');
    c.sim_control(1, firstNote - 53, 1); render(64);
    check(c.betis_song_position() === 1, 'Holding the correct key advances once only');
    c.sim_control(1, firstNote - 53, 0);
    c.sim_control(2, 2, 12);
    check(c.betis_song_position() === 13, 'K1 seeks within the lesson');
    tap(13);
    check(c.betis_song_position() === 8, 'REC repeats the current eight-note phrase');
    c.sim_control(2, 2, -127);
    check(c.betis_song_position() === 0, 'Lesson seeking clamps at the first note');
    const flashBeforeLesson = c.sim_flash_revision();
    for (let step = 0; step < lessonCount; step++) {
      const note = c.betis_song_note(), key = note - 53;
      check(key >= 0 && key < 27, `Lesson note ${step + 1} fits the physical keyboard`);
      c.sim_lcd_targets();
      check(state()[168 + 14 + key] === 1, `Next key LED lights for step ${step + 1}`);
      c.sim_control(1, key, 1); c.sim_control(1, key, 0); render(8);
      check(c.betis_song_position() === step + 1, `Correct panel note advances step ${step + 1}`);
    }
    check(c.betis_song_note() === 128, 'Completed lesson has no phantom next note');
    check(c.sim_flash_revision() === flashBeforeLesson, 'Completing the lesson does not write flash');
    tap(3);
    check(c.betis_song_mode() === 0 && c.betis_tuning_cents(0, 1) === tuningBeforeHymn &&
      (c.sim_arp(0) & 256) !== 0, 'SCL stops and restores scale and arp');
    tap(12);
    check(c.betis_song_mode() === 1, 'PLAY starts the integrated hymn without external MIDI');
    const hymnSound = render(21000);
    check(hymnSound.rms > 0.00001 && hymnSound.peak <= 1.00001, 'Integrated melody produces bounded audible FM audio');
    check(c.betis_song_mode() === 0 && c.betis_song_position() === lessonCount, 'Integrated hymn finishes every melody step');
    render(4000);
    check(render(256).rms < 0.0001, 'Integrated hymn releases notes and decays to silence');
    tap(6); tap(8);
    check(c.betis_song_mode() === 0 && state()[1] === 0 &&
      c.betis_tuning_cents(0, 1) === tuningBeforeHymn, 'HOME exits learning and restores tuning');
  } else {
    tap(6);
    check(c.betis_song_mode() === 0, 'Public build explicitly refuses a lesson without private hymn data');
  }
  c.sim_control(0,8,1); c.sim_control(0,2,1); c.sim_release();
  check(c.sim_select(7, 0) === 0, 'Test can replace track 8 with FM');
  c.sim_open(19);
  c.sim_control(0,8,1); c.sim_control(0,2,1); c.sim_release(); tap(2);
  const changedSource = project();
  tap(6);
  const refusedRhythm = project();
  check(changedSource.every((byte, i) => byte === refusedRhythm[i]),
    'Crowd rhythm refuses non-808 track without changing the project');
  document.getElementById('results').textContent = `PASS (${results.length} checks)\n` + results.join('\n');
  globalThis.testResult = {passed:true,checks:results.length,sounding};
} catch (error) {
  document.getElementById('results').textContent = `FAIL: ${error.stack}\n` + results.join('\n');
  globalThis.testResult = {passed:false,error:String(error),checks:results.length};
}
</script>
