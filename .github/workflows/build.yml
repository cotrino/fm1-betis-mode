name: Verify firmware and web emulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test melody extraction and interval preservation
        shell: powershell
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build with verified official toolchains
        shell: powershell
        run: .\Build.ps1
      - name: Verify package and corresponding-source checksums
        shell: powershell
        run: .\tools\Verify.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FM1-Betis-Mode
          path: docs
